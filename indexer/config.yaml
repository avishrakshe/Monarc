# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: MonarcHyperIndex
description: Envio HyperIndex for Monarc DeFi Agent Marketplace on Monad
ecosystem: evm
schema: ./schema.graphql

networks:
  - id: 10143 # Monad Testnet
    rpc_config:
      url: https://testnet-rpc.monad.xyz
    hypersync_config:
      url: https://monad-testnet.hypersync.xyz
    start_block: 0
    contracts:
      - name: IdentityRegistry
        abi_file_path: ./abis/IdentityRegistry.json
        address:
          - "0x0000000000000000000000000000000000000000"
        handler: ./src/EventHandlers.ts
        events:
          - event: AgentRegistered(uint256 indexed agentId, address indexed owner, uint256 verifiedAt)

      - name: PaymentSettlement
        abi_file_path: ./abis/PaymentSettlement.json
        address:
          - "0x0000000000000000000000000000000000000000"
        handler: ./src/EventHandlers.ts
        events:
          - event: JobCreated(uint256 indexed jobId, uint256 indexed posterId, uint256 amount, bytes32 deliverableSpec)
          - event: JobAccepted(uint256 indexed jobId, uint256 indexed workerId)
          - event: DeliverySubmitted(uint256 indexed jobId, bytes32 proofHash, uint256 challengeDeadline)
          - event: DeliveryConfirmed(uint256 indexed jobId, address indexed workerWallet, uint256 amount)
          - event: DeliveryDisputed(uint256 indexed jobId, address indexed disputer)
          - event: DisputeResolved(uint256 indexed jobId, uint256 indexed winnerId, uint256 indexed loserId, uint256 slashedAmount)

      - name: StakeManager
        abi_file_path: ./abis/StakeManager.json
        address:
          - "0x0000000000000000000000000000000000000000"
        handler: ./src/EventHandlers.ts
        events:
          - event: Slashed(uint256 indexed agentId, uint256 amount, string reason, address recipient)
          - event: Staked(uint256 indexed agentId, address indexed staker, uint256 amount)

      - name: ReputationRegistry
        abi_file_path: ./abis/ReputationRegistry.json
        address:
          - "0x0000000000000000000000000000000000000000"
        handler: ./src/EventHandlers.ts
        events:
          - event: OutcomeRecorded(uint256 indexed agentId, bool success, uint256 indexed counterpartyId, uint256 timestamp)
          - event: ExternalSignalUpdated(uint256 indexed agentId, int256 nansenScore, uint256 timestamp)
