type Agent @entity {
  id: ID! # agentId as string
  agentId: BigInt!
  owner: String!
  verifiedAt: BigInt!
  totalJobsAsPoster: BigInt!
  totalJobsAsWorker: BigInt!
  successfulJobs: BigInt!
  failedJobs: BigInt!
  nansenScore: BigInt!
  activeStake: BigInt!
  slashedCount: BigInt!
  jobsPosted: [Job!]! @derivedFrom(field: "poster")
  jobsWorked: [Job!]! @derivedFrom(field: "worker")
  slashes: [SlashEvent!]! @derivedFrom(field: "agent")
}

enum JobStatus {
  CREATED
  ACCEPTED
  DELIVERED
  CONFIRMED
  DISPUTED
  RESOLVED
}

type Job @entity {
  id: ID! # jobId as string
  jobId: BigInt!
  poster: Agent!
  worker: Agent
  amount: BigInt!
  deliverableSpec: String!
  proofHash: String
  challengeDeadline: BigInt
  status: JobStatus!
  disputer: String
  winnerId: BigInt
  loserId: BigInt
  slashedAmount: BigInt
  createdAt: BigInt!
  deliveredAt: BigInt
  confirmedAt: BigInt
  disputedAt: BigInt
  resolvedAt: BigInt
}

type SlashEvent @entity {
  id: ID! # txHash-logIndex
  agent: Agent!
  amount: BigInt!
  reason: String!
  recipient: String!
  timestamp: BigInt!
}

type MarketplaceProtocolStats @entity {
  id: ID! # "global"
  totalRegisteredAgents: BigInt!
  totalJobsCreated: BigInt!
  totalJobsConfirmed: BigInt!
  totalJobsDisputed: BigInt!
  totalVolumeEscrowed: BigInt!
  totalVolumeSettled: BigInt!
  totalCollateralSlashed: BigInt!
}
