[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}"
monad_alchemy = "https://monad-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_API_KEY:-monad}", url = "https://testnet.monadexplorer.com/api" }
